name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install dependencies
        run: brew bundle

      - name: Generate Arkana keys
        env:
          SentryDSN: ${{ secrets.SENTRYDSN }}
        run: bundle exec arkana

      - name: Generate Xcode project
        run: xcodegen

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project ClaudeSquad.xcodeproj \
            -scheme ClaudeSquad \
            -configuration Debug \
            -destination 'platform=macOS' \
            build 2>&1 | xcbeautify

  test:
    name: Test
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install dependencies
        run: brew bundle

      - name: Generate Arkana keys
        env:
          SentryDSN: ${{ secrets.SENTRYDSN }}
        run: bundle exec arkana

      - name: Generate Xcode project
        run: xcodegen

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild -project ClaudeSquad.xcodeproj \
            -scheme ClaudeSquad \
            -configuration Debug \
            -destination 'platform=macOS' \
            test 2>&1 | xcbeautify
