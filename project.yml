name: ClaudeSquad

packages:
  SwiftyBeaver:
    url: https://github.com/SwiftyBeaver/SwiftyBeaver
    version: 2.1.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    version: 8.44.0
  AmplitudeSwift:
    url: https://github.com/amplitude/Amplitude-Swift
    version: 1.12.0

options:
  bundleIdPrefix: com.armcknight
  xcodeVersion: 16.0
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: config/Project.xcconfig
  Release: config/Project.xcconfig

fileGroups:
  - config
  - Fixtures
  - README.md
  - Makefile
  - Brewfile
  - project.yml
  - .gitignore
  - .claude
  - .github

targets:
  ClaudeSquad:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/ClaudeSquad
      - path: Fixtures
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
            subpath: ""
    dependencies:
      - package: SwiftyBeaver
      - package: Sentry
      - package: AmplitudeSwift
    configFiles:
      Debug: config/ClaudeSquad.xcconfig
      Release: config/ClaudeSquad.xcconfig

  ClaudeSquadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ClaudeSquadTests
    dependencies:
      - target: ClaudeSquad
    configFiles:
      Debug: config/ClaudeSquadTests.xcconfig
      Release: config/ClaudeSquadTests.xcconfig

  ClaudeSquadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/ClaudeSquadUITests
    dependencies:
      - target: ClaudeSquad
    configFiles:
      Debug: config/ClaudeSquadUITests.xcconfig
      Release: config/ClaudeSquadUITests.xcconfig

schemes:
  ClaudeSquad:
    build:
      targets:
        ClaudeSquad: all
        ClaudeSquadUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "--mock": false
    test:
      config: Debug
      targets:
        - ClaudeSquadTests
        - ClaudeSquadUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
