name: ClaudeSquad

packages:
  SwiftyBeaver:
    url: https://github.com/SwiftyBeaver/SwiftyBeaver
    version: 2.1.1
  ArkanaKeys:
    path: ./ArkanaKeys/ArkanaKeys
  ArkanaKeysInterfaces:
    path: ./ArkanaKeys/ArkanaKeysInterfaces

projectReferences:
  Sentry:
    path: sentry-cocoa/Sentry.xcodeproj

options:
  bundleIdPrefix: io.mcknight
  xcodeVersion: 16.0
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: config/Project.xcconfig
  Release: config/Project.xcconfig

fileGroups:
  - config
  - Fixtures
  - README.md
  - LICENSE
  - Makefile
  - Brewfile
  - Gemfile
  - project.yml
  - .gitignore
  - .arkana.yml
  - .github
  - .env
  - CHANGELOG.md
  - scripts/

targets:
  ClaudeSquad:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/ClaudeSquad
      - path: CHANGELOG.md
        buildPhase: resources
      - path: Fixtures
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
            subpath: ""
    postBuildScripts:
      - name: Inject Git Info
        script: '/opt/homebrew/bin/inject-git-info'
        basedOnDependencyAnalysis: false
      - name: Upload Symbols to Sentry
        script: '/opt/homebrew/bin/upload-symbols || true'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    dependencies:
      - package: SwiftyBeaver
      - target: Sentry/Sentry
      - package: ArkanaKeys
      - package: ArkanaKeysInterfaces
    configFiles:
      Debug: config/ClaudeSquad.xcconfig
      Release: config/ClaudeSquad.xcconfig

  ClaudeSquadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ClaudeSquadTests
    dependencies:
      - target: ClaudeSquad
    configFiles:
      Debug: config/ClaudeSquadTests.xcconfig
      Release: config/ClaudeSquadTests.xcconfig

  ClaudeSquadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/ClaudeSquadUITests
    dependencies:
      - target: ClaudeSquad
    configFiles:
      Debug: config/ClaudeSquadUITests.xcconfig
      Release: config/ClaudeSquadUITests.xcconfig

schemes:
  ClaudeSquad:
    build:
      targets:
        ClaudeSquad: all
        ClaudeSquadUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "--mock": false
    test:
      config: Debug
      targets:
        - ClaudeSquadTests
        - ClaudeSquadUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
